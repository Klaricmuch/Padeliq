name: Supabase keep-alive

# Free-tier Supabase projects pause after ~7 days of inactivity. This pings the REST API
# daily so the project never counts as inactive. Credentials come from repo secrets
# (Settings -> Secrets and variables -> Actions): SUPABASE_URL and SUPABASE_KEY.

on:
  schedule:
    - cron: '17 7 * * *'   # daily at 07:17 UTC
  workflow_dispatch: {}      # lets you run it on demand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::SUPABASE_URL and/or SUPABASE_KEY repo secrets are not set."
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/club_leads?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          echo "Supabase responded: HTTP $code"
          case "$code" in
            2*) echo "OK — database reached, project kept active." ;;
            *)  echo "::error::Keep-alive did not get a healthy response (HTTP $code). The project may be paused/down or the secrets may be wrong."; exit 1 ;;
          esac
